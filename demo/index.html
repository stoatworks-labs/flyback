  <body>
    <main id="demo">
      <noscript>
        <h1>Flyback</h1>
        <p>
          An FFGL source and effect full of high-voltage discharges: a Jacob's
          ladder, a Tesla coil, a Van de Graaff generator, a plasma globe and a
          Lichtenberg figure. Every spark is grown by the dielectric breakdown
          model on an actual Laplace solve, and each machine's own circuit
          decides when the air gives way and how much light comes out. The
          branching, the forks heading for the nearest ground and the strike
          that takes the short way round all end up where the field puts them.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its engine in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/flyback">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/flyback/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/flyback">Source on GitHub</a></li>
        </ul>
      </noscript>
